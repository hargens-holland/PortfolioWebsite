name: Deploy

# Push to main → build → upload to S3 → clear the CDN cache.
# Nothing else triggers a deploy. Pull requests don't publish.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

# Two deploys racing would leave the bucket half-updated. Queue them instead,
# and don't cancel one mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # REQUIRED — lets the job request an OIDC token from GitHub

env:
  AWS_REGION: us-east-1
  BUILD_DIR: web/out

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Actions are pinned to full commit SHAs, not version tags. A tag like @v5
    # is mutable: whoever controls the action's repo can move it to different
    # code, and this job hands that code AWS credentials. A SHA can't be moved.
    # The comment after each one is the tag the SHA was taken from, so
    # Dependabot and humans can both tell what version it is.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins — no surprise
      # version drift between your machine and this runner.
      - name: Install
        working-directory: web
        run: npm ci

      # Catch a broken build before it reaches the bucket rather than after.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      # Exchanges GitHub's signed OIDC token for temporary AWS credentials.
      # No access keys are stored anywhere; these expire in an hour.
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      # Three uploads, because the right headers differ by file type.
      #
      # Files under _next/static/ have a content hash in the filename, so a
      # changed file is a *different* filename. They can be cached forever.
      #
      # HTML filenames never change, so if a browser cached index.html for a
      # year it would never see your updates. Those must revalidate.
      #
      # Link-preview images (app/opengraph-image.tsx) are emitted as files
      # named just `opengraph-image`, no extension, so S3 can't guess their
      # type. They get their own pass with the content type set explicitly.
      # They're excluded from the first pass because `s3 sync` skips a file
      # that's already uploaded — a later pass can't fix its metadata.
      # ------------------------------------------------------------------

      - name: Upload hashed assets — cache for a year
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*.html" --exclude "*.txt" --exclude "*opengraph-image" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload HTML — always revalidate
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*" --include "*.html" --include "*.txt" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Upload link-preview images — as PNG
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*" --include "*opengraph-image" \
            --content-type "image/png" \
            --cache-control "public, max-age=86400"

      # S3 now has the new files, but CloudFront's edge caches still hold the
      # old ones. This tells all ~600 edge locations to drop them.
      #
      # The first 1,000 invalidation paths each month are free; "/*" counts as
      # one path, so at one deploy per push this stays free.
      - name: Invalidate CloudFront cache
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"
          echo "Cache cleared — the new version is live."
