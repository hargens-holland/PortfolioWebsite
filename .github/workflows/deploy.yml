name: Deploy

# Push to main → build → upload to S3 → clear the CDN cache.
# Nothing else triggers a deploy. Pull requests don't publish.
on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run a deploy by hand from the Actions tab

# Two deploys racing would leave the bucket half-updated. Queue them instead,
# and don't cancel one mid-upload.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # REQUIRED — lets the job request an OIDC token from GitHub

env:
  AWS_REGION: us-east-1
  BUILD_DIR: web/out

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Actions are pinned to full commit SHAs, not version tags. A tag like @v5
    # is mutable: whoever controls the action's repo can move it to different
    # code, and this job hands that code AWS credentials. A SHA can't be moved.
    # The comment after each one is the tag the SHA was taken from, so
    # Dependabot and humans can both tell what version it is.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` installs exactly what package-lock.json pins — no surprise
      # version drift between your machine and this runner.
      - name: Install
        working-directory: web
        run: npm ci

      # Catch a broken build before it reaches the bucket rather than after.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build
        working-directory: web
        run: npm run build

      # Exchanges GitHub's signed OIDC token for temporary AWS credentials.
      # No access keys are stored anywhere; these expire in an hour.
      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ------------------------------------------------------------------
      # Four uploads, because the right headers differ by file type.
      #
      # Only files under _next/static/ have a content hash in the filename,
      # so a changed file is a *different* filename. Those — and only those —
      # can be cached forever.
      #
      # Everything else keeps its name when its content changes: HTML,
      # photos in assets/, the favicon, the résumé. If a browser cached one
      # of those for a year, a visitor who'd seen the site before would keep
      # seeing the old version. HTML must revalidate on every request;
      # photos and the résumé get an hour, which is long enough to be served
      # from cache during a visit and short enough that a swap shows up
      # the same day. (Renaming a photo when you replace it sidesteps the
      # hour entirely.)
      #
      # Link-preview images (app/opengraph-image.tsx) are emitted as files
      # named just `opengraph-image`, no extension, so S3 can't guess their
      # type. They get their own pass with the content type set explicitly.
      #
      # Each pass excludes what the others upload, because `s3 sync` skips
      # a file that's already in the bucket — a later pass can't fix
      # metadata the earlier one set.
      # ------------------------------------------------------------------

      - name: Upload hashed assets — cache for a year
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload HTML — always revalidate
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*" --include "*.html" --include "*.txt" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Upload everything else — cache for an hour
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "_next/static/*" --exclude "*.html" --exclude "*.txt" \
            --exclude "*opengraph-image" \
            --cache-control "public, max-age=3600"

      # `s3 sync` only uploads files whose content changed, so a file that
      # went up under an older Cache-Control value keeps that value until it
      # changes. This copies each unhashed object onto itself with the
      # current header, so the bucket never holds a stale one. It's a dozen
      # files; it costs nothing.
      - name: Re-stamp cache headers on unchanged files
        run: |
          aws s3 cp "s3://${{ secrets.AWS_S3_BUCKET }}/" "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --recursive \
            --exclude "_next/static/*" --exclude "*.html" --exclude "*.txt" \
            --exclude "*opengraph-image" \
            --metadata-directive REPLACE \
            --cache-control "public, max-age=3600"

      - name: Upload link-preview images — as PNG
        run: |
          aws s3 sync "$BUILD_DIR/" "s3://${{ secrets.AWS_S3_BUCKET }}" \
            --delete \
            --exclude "*" --include "*opengraph-image" \
            --content-type "image/png" \
            --cache-control "public, max-age=86400"

      # S3 now has the new files, but CloudFront's edge caches still hold the
      # old ones. This tells all ~600 edge locations to drop them.
      #
      # The first 1,000 invalidation paths each month are free; "/*" counts as
      # one path, so at one deploy per push this stays free.
      - name: Invalidate CloudFront cache
        run: |
          ID=$(aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' --output text)
          echo "Invalidation $ID created"
          aws cloudfront wait invalidation-completed \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --id "$ID"
          echo "Cache cleared — the new version is live."
