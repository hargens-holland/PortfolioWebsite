# AWS Amplify Hosting build spec.
#
# Not used by the real deploy — that's S3 + CloudFront via GitHub Actions (see
# .github/workflows/deploy.yml and infra/). This is here so the site can be
# stood up on Amplify in a couple of clicks if that's ever useful.
#
# Amplify auto-detects Next.js but not that the app lives in a subdirectory, so
# `appRoot` is the part that matters. In the console: connect the repo, and
# Amplify picks this file up automatically — no build settings to fill in.
#
# `baseDirectory` is `out`, not `.next`: next.config.ts sets `output: "export"`,
# so the build emits plain static files into web/out and .next holds only
# intermediate artifacts.

version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: out
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
